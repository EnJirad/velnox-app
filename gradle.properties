# ─── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ─── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# ─── Android ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false

# ─── Velnox ──────────────────────────────────────────────────────────────────
# Base URL of the Velnox backend API (origin only, no /api suffix).
# Override per environment with -Pvelnox.api.baseUrl=... or a local.properties entry.
velnox.api.baseUrl=https://velnox-api.onrender.com
# Web (OAuth) client id of the Velnox Google project. Public value, safe to embed.
# Android native sign-in requests an ID token with aud = this client id so the
# backend's existing audience check keeps working unchanged.
#
# This is the *web* client id, not an Android one, and it is deliberately the same
# value the backend holds in GOOGLE_CLIENT_ID — verified against the live OAuth
# redirect (https://velnox-api.onrender.com/auth/google) rather than guessed. A web
# client id is a public identifier: it is already visible in that redirect URL and
# in the web bundles, and it is not a credential (`GOOGLE_CLIENT_SECRET` is, and it
# must never exist in this repository).
#
# Override per environment with -Pvelnox.google.webClientId=... or local.properties.
# A blank override falls through to this value. Clearing this default makes every
# build report "sign-in is not configured" instead of falling back to a fake login.
velnox.google.webClientId=610153333350-6j5vhhhf0fcsf2rgo5buk4cqepeum0gj.apps.googleusercontent.com
