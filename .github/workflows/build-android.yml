name: Build Android

# Builds VelShop, Velseller and VelCenter from one repository.
#
# Contract (from the project brief):
#   * all three apps must build in the same run;
#   * a failure in ANY app fails the whole workflow — no "PASS/PASS/FAIL" success,
#     no skipped app, no placeholder APK;
#   * the run publishes `velnox-android-release.zip` containing exactly
#     VelShop.apk, Velseller.apk and VelCenter.apk, as the `velnox-android-release`
#     artifact.
#
# The fail-fast behaviour comes from GitHub Actions' own semantics: a step that exits
# non-zero fails the job, and `set -euo pipefail` in the shell steps makes a failed
# APK check abort the step. Nothing here is wrapped in `continue-on-error`, so a broken
# app cannot be hidden.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
  # Public value. Override with a repository variable if the backend moves.
  VELNOX_API_BASE_URL: ${{ vars.VELNOX_API_BASE_URL || 'https://velnox-api.onrender.com' }}
  # Public OAuth *web* client id. When the repository variable is unset this is
  # empty and Gradle falls through to the checked-in default in gradle.properties;
  # an empty `-P` must never erase that default (see
  # gradle/velnox-properties.gradle.kts). A web client id is a public identifier,
  # not a credential, so it is a repository variable rather than a secret — and no
  # value is written here and none is ever echoed, so this file stays free of
  # plaintext configuration and of anything that could reach a log.
  VELNOX_GOOGLE_WEB_CLIENT_ID: ${{ vars.VELNOX_GOOGLE_WEB_CLIENT_ID }}

jobs:
  build:
    name: Build all Velnox apps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Keep the configuration cache off in CI: it is a local speed-up and its
          # cache is per-machine, so enabling it here only adds failure modes.
          cache-read-only: false

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Repository-level guards, run before the expensive Gradle work: the three
      # application ids must be unique and namespaced (or one APK silently replaces
      # another), the version catalog must resolve, and no backend secret name may
      # appear in the shipped sources. Failing here is a five-second fix instead of a
      # forty-minute build that produces a subtly wrong artefact.
      - name: Verify build configuration
        run: |
          set -euo pipefail
          bun tools/verify-android-config.ts

      # Guard against the class of failure that has no source-code cause: `gradlew`
      # losing its executable bit. Git records the mode, but a tree produced by a tool
      # that does not preserve it (a zip export, a copy through a filesystem without
      # POSIX modes, a re-commit from an editor that rewrites the file) arrives as
      # 100644 and every later `./gradlew` dies with "Permission denied" / exit 126.
      # Failing here is instant and unambiguous, instead of surfacing as a confusing
      # dependency-restore error.
      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -x ./gradlew
          ./gradlew --version

      - name: Restore dependencies
        run: |
          set -euo pipefail
          ./gradlew \
            -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            --no-daemon \
            :core:ui:dependencies :core:data:dependencies \
            > /dev/null

      # Pin the debug signing key before any Gradle work. Google matches an Android
      # OAuth client on (package name, signing certificate SHA-1), and a runner that has
      # no debug keystore generates one — a fresh key, so a new SHA-1 every run, and any
      # fingerprint registered in Google Cloud stops matching on the next run. Supplying
      # the keystore is what makes the fingerprint stable enough to register once.
      #
      # The location is not `$HOME/.android`, which is the trap here. AGP's
      # AndroidLocation prefers ANDROID_USER_HOME, then XDG_CONFIG_HOME — a GitHub runner
      # sets that to `/home/runner/.config` — and only then `$HOME`. Measured with
      # `:app:velshop:signingReport` under each combination: with ANDROID_USER_HOME set
      # the store is `$ANDROID_USER_HOME/debug.keystore` (no `.android` suffix), and it
      # wins over XDG_CONFIG_HOME. Setting it here removes the guesswork entirely, so a
      # keystore written to `$HOME/.android` — silently ignored by the build — cannot
      # happen again.
      # `secrets` is read in step-scoped `env` because the context is not available at
      # workflow level.
      - name: Provision debug signing keystore
        env:
          # Optional, operator-supplied debug signing key (base64 of a JKS). A real
          # secret, and never printed.
          VELNOX_DEBUG_KEYSTORE_BASE64: ${{ secrets.VELNOX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          android_user_home="$RUNNER_TEMP/android-user-home"
          mkdir -p "$android_user_home"
          # Exported so every later Gradle step resolves the same, single keystore.
          echo "ANDROID_USER_HOME=$android_user_home" >> "$GITHUB_ENV"

          keystore="$android_user_home/debug.keystore"
          if [ -n "${VELNOX_DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$VELNOX_DEBUG_KEYSTORE_BASE64" \
              | tr -d '\n\r ' \
              | base64 -d > "$keystore"
            test -s "$keystore"
            echo "Using the debug keystore supplied as VELNOX_DEBUG_KEYSTORE_BASE64"
          else
            # Same shape AGP would generate (RSA 2048, 10000 days, the fixed debug
            # alias and password), created up front so its fingerprint can be reported
            # and registered. A per-run key is still a per-run fingerprint, hence the
            # warning.
            keytool -genkeypair -keystore "$keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning title=Unstable debug certificate::no VELNOX_DEBUG_KEYSTORE_BASE64 was supplied, so this run generated a new debug key and the SHA1 reported below will change on the next run. Register a stable key instead, or supply the secret."
          fi

      # AGP 8.7's `signingReport` prints the keystore path but not the fingerprints, so
      # the certificate is read back with keytool. The path comes from Gradle rather than
      # from this file: that is what ties the printed fingerprint to the key the APKs are
      # actually signed with, instead of to a path this workflow merely hoped for.
      - name: Report debug signing certificate
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --console=plain \
            -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            :app:velshop:signingReport > "$RUNNER_TEMP/signing-report.txt"

          stores=$(grep -E '^Store:' "$RUNNER_TEMP/signing-report.txt" \
            | awk '{print $2}' | grep -v '^null$' | sort -u)
          if [ -z "$stores" ]; then
            echo "::error title=No debug keystore::signingReport resolved no keystore, so the debug APKs would be signed by an unregistered key"
            exit 1
          fi

          echo "An Android OAuth client must exist in the Velnox Google Cloud project for"
          echo "each package below, carrying the SHA1 printed for it."
          for store in $stores; do
            echo
            echo "== debug signing certificate: $store =="
            # A certificate fingerprint is public by design — it is the value registered
            # with Google, not a credential. Only the fingerprint is printed; the store
            # password is AGP's fixed debug password and is never echoed.
            keytool -list -v -keystore "$store" -storepass android -alias androiddebugkey \
              | grep -E 'Alias name:|Owner:|Valid from:|SHA1:|SHA256:'
          done

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            testDebugUnitTest

      - name: Run static analysis (lint)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            lintDebug \
            -Pandroid.lint.abortOnError=true

      # One assemble invocation for all three apps. A failure in any app fails the
      # step, which is exactly the required "all or nothing" behaviour.
      - name: Assemble VelShop
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            :app:velshop:assembleDebug

      - name: Assemble Velseller
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            :app:velseller:assembleDebug

      - name: Assemble VelCenter
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pvelnox.api.baseUrl="$VELNOX_API_BASE_URL" \
            -Pvelnox.google.webClientId="$VELNOX_GOOGLE_WEB_CLIENT_ID" \
            :app:velcenter:assembleDebug

      # What the compiler produced, as opposed to what Gradle was told. These are not
      # the same test: a property can be read into a Gradle `extra` and still never
      # reach a `buildConfigField`. Only the generated BuildConfig proves the client id
      # is in the artefact, and an APK without it can never sign anyone in — it shows
      # "sign-in is unavailable" instead of failing, so only a check catches it.
      # Shape is verified; the value is never printed.
      - name: Verify the build carries a Google client id
        run: |
          set -euo pipefail

          build_config="core/auth/build/generated/source/buildConfig/debug/com/velnox/core/auth/BuildConfig.java"
          if [ ! -f "$build_config" ]; then
            echo "::error title=Missing BuildConfig::core:auth generated no BuildConfig at $build_config"
            exit 1
          fi

          client_id=$(grep -oE 'VELNOX_GOOGLE_WEB_CLIENT_ID = "[^"]*"' "$build_config" \
            | sed 's/.*= "//; s/"$//')

          if [ -z "$client_id" ]; then
            echo "::error title=Google sign-in not configured::the built core:auth carries an empty VELNOX_GOOGLE_WEB_CLIENT_ID, so every screen would report that sign-in is unavailable. Set the repository variable VELNOX_GOOGLE_WEB_CLIENT_ID, or restore the default in gradle.properties."
            exit 1
          fi

          if ! printf '%s' "$client_id" | grep -qE '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'; then
            echo "::error title=Malformed Google client id::VELNOX_GOOGLE_WEB_CLIENT_ID is not a <project-number>-<hash>.apps.googleusercontent.com value. Check the repository variable and gradle.properties."
            exit 1
          fi

          echo "OK  core:auth carries a well-formed Google web client id"

      # Explicit verification. `find` returning nothing yields an empty variable and
      # the guard below fails the job — an APK that silently did not appear can never
      # pass as success.
      - name: Verify and rename APKs
        run: |
          set -euo pipefail

          declare -A APKS=(
            [VelShop]="app/velshop/build/outputs/apk/debug/velshop-debug.apk"
            [Velseller]="app/velseller/build/outputs/apk/debug/velseller-debug.apk"
            [VelCenter]="app/velcenter/build/outputs/apk/debug/velcenter-debug.apk"
          )

          mkdir -p release

          for name in VelShop Velseller VelCenter; do
            src="${APKS[$name]}"
            if [ ! -f "$src" ]; then
              echo "::error title=Missing APK::$name produced no APK at $src"
              exit 1
            fi
            size=$(stat -c%s "$src")
            if [ "$size" -lt 100000 ]; then
              echo "::error title=Suspicious APK::$name APK is only ${size} bytes"
              exit 1
            fi
            cp "$src" "release/${name}.apk"
            echo "OK  ${name}.apk  (${size} bytes)"
          done

          # Exactly three APKs, no strays.
          count=$(find release -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error title=Wrong APK count::expected 3 APKs, found $count"
            exit 1
          fi

      - name: Create velnox-android-release.zip
        run: |
          set -euo pipefail
          cd release
          zip -X velnox-android-release.zip VelShop.apk Velseller.apk VelCenter.apk
          unzip -l velnox-android-release.zip
          mv velnox-android-release.zip ../velnox-android-release.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velnox-android-release
          path: velnox-android-release.zip
          if-no-files-found: error
          retention-days: 30
